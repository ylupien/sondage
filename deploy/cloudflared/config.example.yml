# Modèle : copier en config.yml (hors Git) et créer credentials.json avec `cloudflared tunnel create` (voir README).
tunnel: <id-du-tunnel>
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true
ingress:
  - hostname: sondage.exemple.com
    service: http://app:8900
  - service: http_status:404
